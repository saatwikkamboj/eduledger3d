name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and Package Windows App
        run: npx electron-builder --win --x64 -c.publish=never
        env:
          CI: false

      - name: Upload Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: EduLedger-Windows-App
          path: release/*.exe
          retention-days: 7
